name: car_connection
description: Tells whether the phone is connected to a car (Android Auto / Android Automotive).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: eco.aux.fm.car_connection
        pluginClass: CarConnectionPlugin
