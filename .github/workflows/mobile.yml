name: Mobile app

on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: write # post the APK link as a commit comment

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Shown in Android's app info and at the bottom of the station list.
      VERSION: 1.0.${{ github.run_number }}
      # Secrets can't be tested in `if:`; this can.
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Release signing key
        # Without the secrets (e.g. pull requests from forks) the APK is
        # signed with a throwaway debug key instead.
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          EOF
      - run: >-
          flutter build apk --release
          --build-name=$VERSION
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=$VERSION
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: aux-fm-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Link the APK on the commit
        if: github.event_name == 'push'
        # A convenience; never fail the build over it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="📱 **Android APK $VERSION for this commit:** [download aux-fm-android.zip]($APK_URL)

          Unzip it and open \`app-release.apk\` on your phone. Install steps: [mobile/README.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/mobile/README.md#install-on-android) · [build log]($RUN_URL)"
