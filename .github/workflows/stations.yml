name: Station streams

# Checks that every station's stream still delivers audio. Weekly, and
# whenever the station lists or the checker change.
on:
  push:
    paths:
      - 'mobile/lib/data/**'
      - 'mobile/tool/**'
      - '.github/workflows/stations.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Candidates
        if: hashFiles('mobile/tool/candidates.txt') != ''
        run: dart run tool/check_stations.dart --candidates tool/candidates.txt
      - name: App stations
        run: dart run tool/check_stations.dart
